<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{header}</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <template if:true={showSpinner}>
                    <div>
                        <div class="slds-spinner_container">
                            <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                    </div>
                </template>
                <template if:false={catalog}>
                    <lightning-tabset>
                        <lightning-tab label="Info">
                            <lightning-layout multiple-rows>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input read-only={showEditBtn} type="text" label={nameFieldLabel} value={name} max-length="30"
                                        onchange={handleNameChange} required></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-combobox name="source" label="Icon Source" value={source}
                                        placeholder="Icon Source" options={sourceOptions} onchange={handleSourceChange}
                                        required></lightning-combobox>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <template if:true={showIconOption}>
                                        <lightning-combobox name="icons" label="Icon Details" value={icondetail}
                                            placeholder="Select Icon" options={iconOption}
                                            onchange={handleIconDetailChange} required></lightning-combobox>
                                    </template>
                                    <template if:false={showIconOption}>
                                        <lightning-input type="text" label="Icon Details"
                                            onchange={handleIconDetailChange} value={icondetail}
                                            required></lightning-input>
                                    </template>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input type="number" name="sequence" label="Sequence"
                                        onchange={handleSequenceChange} value={sequence} max-length="3"
                                        required></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12" padding="around-small">
                                    <lightning-textarea name="description" label="Description"
                                        onchange={handleDescriptionChange} value={description} max-length="120"
                                        required></lightning-textarea>
                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-tab>
                        <lightning-tab label={tabName}>
                            <lightning-record-edit-form object-api-name={objectApiName} record-id={recId}>
                                <lightning-layout multiple-rows>
                                    <lightning-layout-item size="6">
                                        <lightning-input-field field-name="Name" value={name} disabled></lightning-input-field>
                                    </lightning-layout-item>
                                    <template for:each={fields} for:item="item" for:index="i">
                                        <template if:false={item.hideField}>
                                            <lightning-layout-item key={item.fieldPath} size="6">
                                                <lightning-input-field field-name={item.fieldPath} required={item.Required}></lightning-input-field>
                                            </lightning-layout-item>
                                        </template>
                                    </template>
                                    <!--lightning-layout-item size="6" if:true={isConnection} class="slds-p-right_x-small">
                                        <c-req-mapping-comp 
                                            name="Request Mapping" 
                                            lookup-label="Request Mapping" 
                                            selected-value={requestMapping}
                                            selected-record-id={requestMappingId}
                                            onselect={handleSelectRequestMapping}>
                                            </c-req-mapping-comp>
                                    </lightning-layout-item-->
                                    <lightning-layout-item size="6" if:true={isConnection}>
                                        <c-a-i-custom-lookup-component 
                                            name="Response Mapping" 
                                            lookup-label="Response Mapping" 
                                            object-api-name={responseMappingMetadataName}
                                            icon-name="standard:bill_of_materials"
                                            field="Name"
                                            selected-value={responseMapping}
                                            selected-record-id={responseMappingId}
                                            onselect={handleSelectResponseMapping}></c-a-i-custom-lookup-component>
                                    </lightning-layout-item>
                                </lightning-layout> 
                            </lightning-record-edit-form>
                        </lightning-tab>
                    </lightning-tabset>
                </template>
                <template if:true={catalog}>
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="6" padding="around-small">
                            <lightning-input read-only={showEditBtn} type="text" label="Label" value={name} max-length="30"
                                onchange={handleNameChange} required></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="around-small">
                            <lightning-combobox name="source" label="Icon Source" value={source}
                                placeholder="Icon Source" options={sourceOptions} onchange={handleSourceChange}
                                required></lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="around-small">
                            <template if:true={showIconOption}>
                                <lightning-combobox name="icons" label="Icon Details" value={icondetail}
                                    placeholder="Select Icon" options={iconOption} onchange={handleIconDetailChange}
                                    required></lightning-combobox>
                            </template>
                            <template if:false={showIconOption}>
                                <lightning-input type="text" label="Icon Details" onchange={handleIconDetailChange}
                                    value={icondetail} required></lightning-input>
                            </template>
                        </lightning-layout-item>
                        <lightning-layout-item size="6" padding="around-small">
                            <lightning-input type="number" name="sequence" label="Sequence"
                                onchange={handleSequenceChange} value={sequence} max-length="3"
                                required></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" padding="around-small">
                            <lightning-textarea name="description" label="Description"
                                onchange={handleDescriptionChange} value={description} max-length="120"
                                required></lightning-textarea>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
            </div>
            <div class="slds-modal__footer slds-text-align_center">
                <button class="slds-button slds-button_neutral" aria-label="Cancel and close"
                    onclick={handleCancel}>Cancel</button>
                <template if:true={showEditBtn}>
                    <button class="slds-button slds-button_brand" name="update" onclick={updateRecord}>Save</button>
                    <!--<template if:true={catalog}>-->
                        <button class="slds-button slds-button_brand" onclick={deleteMetadataRecord}>Delete</button>
                    <!--</template>-->
                </template>
                <template if:false={showEditBtn}>
                    <button class="slds-button slds-button_brand" name="save" onclick={createRecord}>Save</button>
                </template>
                <template if:false={catalog}>
                    <button class="slds-button slds-button_brand" onclick={handleActivate}>Activate</button>
                </template>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

</template>
