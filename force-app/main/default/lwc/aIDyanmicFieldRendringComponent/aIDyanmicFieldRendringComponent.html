<template>
	<template if:true={data}>
		<div class="slds-grid slds-wrap">
			<template for:each={data} for:item="dt">
				<div class="slds-col slds-size_1-of-2" key={dt.apiName}>
					<div style="text-align:center;">
						<lightning-button 
							variant="base" 
							label="View In JSON Viewer" 
							title="View In JSON Viewer"
							onclick={handleClick} 
							class="slds-m-left_x-small" 
							name={dt.apiName}>
						</lightning-button>
					</div>
					<p class="slds-p-left_medium slds-p-bottom_x-small" style="color: #444444;">{dt.label}</p>
    				<p class="slds-p-left_medium slds-p-right_medium" style="overflow-wrap: break-word;">
						<lightning-formatted-text 
							value={dt.value}
						></lightning-formatted-text>
					</p>
				</div>
			</template>
		</div>
	</template>
	<template if:true={showModal}>
		<section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
			class="slds-modal slds-fade-in-open slds-modal_large">
			<div class="slds-modal__container">
				<div class="slds-modal__header">
					<h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">JSON Viewer</h1>
				</div>
				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
					<c-j-s-o-n-viewer jsoninput={fieldVal}></c-j-s-o-n-viewer>
				</div>
				<div class="slds-modal__footer">
					<button class="slds-button slds-button_neutral" aria-label="Cancel and close" type="button" onclick={handleClick}>Cancel</button>
				</div>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
	</template>
</template>
