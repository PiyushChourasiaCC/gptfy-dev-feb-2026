<template>
    <template if:true={isDialogVisibile}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleCancel}></lightning-button-icon>
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">AI Mass Processing</h1>
            </div>
            <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-1" style="min-height:550px;">
                <template if:true={showSpinner}>
                    <div style="height:19rem;position:relative">
                        <div class="slds-spinner_container">
                            <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                    </div>
                </template>
                <template if:false={showSpinner}>
                    <div class="slds-grid slds-grid_vertical">
                        <div class="slds-col">
                            <lightning-input 
                                type="text" 
                                name="schedulerName" 
                                label="Name"
                                value={schedulerName}
                                onchange={handleNameChange}
                                required
                            ></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-combobox
                                name="selectedScheduleOption"
                                label="Scheduling Frequency"
                                value={selectedScheduleOption}
                                onchange={handleScheduleOptionChange}
                                options={scheduleOptions}
                                required
                                class="selectedScheduleOption"
                                dropdown-alignment="auto"
                            ></lightning-combobox>
                        </div>
                        <template if:false={showCustom}>
                            <div class="slds-col">
                                <template if:true={showHoursOptions}>
                                    <lightning-dual-listbox 
                                        name="hours"
                                        label="Hours"
                                        source-label="Hours"
                                        selected-label="Selected"
                                        variant="label-hidden"
                                        options={hoursOptions}
                                        disable-reordering
                                        min="1"
                                        required
                                        value={selectedSchedules}
                                        onchange={handleDaysOptionsChange}
                                    ></lightning-dual-listbox>
                                </template>
                                <template if:true={showWeekdaysOptions}>
                                    <lightning-dual-listbox 
                                        name="weekdays"
                                        label="Weekdays"
                                        source-label="Weekdays"
                                        selected-label="Selected"
                                        variant="label-hidden"
                                        options={weekdaysOptions}
                                        disable-reordering
                                        min="1"
                                        required
                                        value={selectedSchedules}
                                        onchange={handleDaysOptionsChange}
                                    ></lightning-dual-listbox>
                                </template>
                                <template if:true={showMonthsDaysOptions}>
                                    <lightning-dual-listbox 
                                        name="days"
                                        label="Days"
                                        source-label="Days"
                                        variant="label-hidden"
                                        required
                                        selected-label="Selected"
                                        options={monthDaysOptions}
                                        disable-reordering
                                        min="1"
                                        value={selectedSchedules}
                                        onchange={handleDaysOptionsChange}
                                    ></lightning-dual-listbox>
                                </template>
                            </div>
                            <template if:false={showHoursOptions}>
                                <div class="slds-col">
                                    <lightning-input 
                                        type="time" 
                                        name="scheduleTime" 
                                        label="Schedule time"
                                        time-style="short"
                                        value={scheduleTime}
                                        onchange={handleTimeChange}
                                        required
                                    ></lightning-input>
                                </div>
                            </template> 
                        </template>
                        <template if:true={showCustom}>
                            <div class="slds-col">
                                <lightning-input 
                                    type="text" 
                                    name="cronExp" 
                                    label="Cron Expression"
                                    value={cronExp}
                                    onchange={handleCronExpChange}
                                    required
                                ></lightning-input>
                            </div>
                        </template> 
                    </div>
                    <lightning-accordion allow-multiple-sections-open>
                        <lightning-accordion-section name="A" label="Advanced Settings">
                            <lightning-input 
                                type="number" 
                                name="retryCount" 
                                label="Retry Count"
                                value={retryCount}
                                onchange={handleRetryCountChange}
                            ></lightning-input>
                        </lightning-accordion-section>
                    </lightning-accordion>
                </template>
            </div>
            <div class="slds-modal__footer">
                <lightning-button label="Cancel" title="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button label="Save" title="Save" onclick={handleSave} variant="brand" class="slds-m-left_x-small"></lightning-button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
  </template>
</template>
