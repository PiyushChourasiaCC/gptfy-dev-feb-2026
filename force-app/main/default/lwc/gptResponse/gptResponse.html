<template>
    <template lwc:if={canvasConfig.showCanvas}>
        <c-a-i-canvas
            skip-wire-update={canvasConfig.skipWireUpdate}
            prompt-id={canvasConfig.promptValue}
            object-api-name={canvasConfig.objectApiName}
            record-id={canvasConfig.recordId}
            show-header={canvasConfig.showCanvasHeader}
            parent-a-i-response-id={canvasConfig.parentAIResponseId}
            is-not-initial-load={canvasConfig.notInitialLoad}
            existing-parent-a-i-response={canvasConfig.existingParentAIResponse}>
        </c-a-i-canvas>
    </template>
    <template lwc:else>
        <template if:true={gptAnsParam}>
            <template if:true={responseId}>
                <article class="slds-card slds-m-left_small">
                    <div class="slds-card__body slds-card__body_inner slds-m-left_x-small">
                        <lightning-formatted-rich-text
                            value={gptAnsParam}
                        ></lightning-formatted-rich-text>
                    </div>
                </article>
            </template>
            <template if:false={responseId}>
                <lightning-formatted-rich-text
                    value={gptAnsParam}
                ></lightning-formatted-rich-text>
            </template>
            
        </template>
        <template if:false={gptAnsParam}>
            <template if:true={chatMessages}>

            <div class="chat-messages-area" lwc:ref="messagesContainer">
              <div class="chat-messages-list" if:true={chatMessages.length}>
                <template for:each={chatMessages} for:item="c">
                    <div key={c.sequence} class="message-item">
                        <!-- User Messages - Right Aligned -->
                        <template if:true={c.question}>
                            <div class="message-wrapper user-message">
                                <div class="message-content">
                                    <div class="message-bubble user-bubble">
                                        <lightning-formatted-rich-text value={c.question}></lightning-formatted-rich-text>
                                    </div>
                                    <!-- <div class="message-timestamp">Me</div> -->
                                </div>
                                <div class="message-avatar">
                                    <div class="user-avatar">
                                        <span class="user-initial">M</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <!-- AI Messages - Left Aligned -->
                        <template if:true={c.answer}>
                            <div class="message-wrapper ai-message">
                                <div class="message-avatar">
                                    <!-- <img src={svgURL} class="avatar-image" alt="AI" /> -->
                                    <lightning-icon icon-name="standard:bot" class="avatar-image"></lightning-icon>
                                </div>
                                
                                <div class="message-content">
                                    <div class="message-bubble ai-bubble">
                                        <lightning-formatted-rich-text value={c.answer}></lightning-formatted-rich-text>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
               </div>
            </div>
            </template>
        </template>
    
    </template>
