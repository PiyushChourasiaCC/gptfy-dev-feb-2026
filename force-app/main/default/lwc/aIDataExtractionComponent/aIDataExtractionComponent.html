<template>
    <template if:true={showSpinner}>
        <div style="height:19rem;position:relative">
            <div class="slds-spinner_container">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>
    </template>

    <template if:false={showSpinner}>

        <lightning-card title="Context Mapping" icon-name="standard:hierarchy">
            <lightning-button-group slot="actions">   
                <lightning-button-icon icon-name="utility:expand_all"  alternative-text="Expand All" title="Expand All" onclick={handleExpandAll}></lightning-button-icon>
                <lightning-button-icon icon-name="utility:collapse_all"  alternative-text="Collapse All" title="Collapse All" onclick={handleCollapseAll}></lightning-button-icon>
                <template if:false={showObjectLabel}>
                    <lightning-button-icon icon-name="utility:preview"  alternative-text="Show Object Label" title="Show Object Label" onclick={handleShowObjectLabel}></lightning-button-icon>
                </template>
                <template if:true={showObjectLabel}>
                    <lightning-button-icon icon-name="utility:hide"  alternative-text="Hide Object Label" title="Hide Object Label" onclick={handleHideObjectLabel}></lightning-button-icon>
                </template>
                <lightning-button-icon icon-name="utility:refresh"  alternative-text="Refresh" title="Refresh" onclick={getAllMappings}></lightning-button-icon>
            </lightning-button-group>

            <template if:true={targetObject}>
                <p class="slds-var-p-horizontal_small">
                    <lightning-tree-grid 
                        columns={columns}
                        data={detailMappings}
                        key-field="detailId"
                        expanded-rows={expandedRows}
                        hide-checkbox-column=true
                        onrowaction={handleRowAction}
                    ></lightning-tree-grid>
                </p>
            </template>

            <template if:false={targetObject}>
                <div class="slds-align_absolute-center" style="height:5rem;">
                    Target Object is missing on Master.
                </div>
            </template>

        </lightning-card>
        
    </template>

    <!-- Delete Related Object Component -->
    <template if:true={showDeleteComponent}>
        <template if:true={deleteDetailId}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleDeleteModalState}></lightning-button-icon>
                        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Delete Object</h1>
                    </div>
                    <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-1">
                        <div class="slds-align_absolute-center" style="height:5rem">
                            Do you really want to delete mapping? Press Yes to continue.
                        </div>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="No" title="No" onclick={handleDeleteModalState}></lightning-button>
                        <lightning-button label="Yes" title="Yes" onclick={handleMappingDelete} variant="brand" class="slds-m-left_x-small"></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </template>

    <!-- Field Mapping Component -->
    <template if:true={showFieldMappingComponent}>
        <template if:true={fieldMappingObjectName}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container" style="min-width:80rem;">
                    <div class="slds-modal__header">
                        <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleFieldMappingModalState}></lightning-button-icon>
                        <h1 id="modal-heading-03" class="slds-modal__title slds-hyphenate">{fieldMappingObjectLabel}</h1>
                    </div>
                    <c-a-i-extraction-field-mapping-component
                        record-id={recordId}
                        object-name={fieldMappingObjectName}
                        onclose={handleFieldMappingModalState}
                        onrefresh={handleRefreshFromChild}
                    ></c-a-i-extraction-field-mapping-component>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </template>

    <!-- Add Related Object Component -->
    <template if:true={showAddComponent}>
        <template if:true={addComponentDetails}>
            <c-a-i-data-extraction-detail-component
                parent-id={addComponentDetails.detailId}
                parent-object={addComponentDetails.objectName}
                dc-objects={datacloudobjects}
                onclose={handleAddModalState}
                master-id={recordId}
                onrefresh={handleRefreshFromChild}
            ></c-a-i-data-extraction-detail-component>
        </template>
    </template>

    <!-- Modify Object Component -->
    <template if:true={showModifyObjectComponent}>
        <template if:true={modifyObjectComponentDetails}>
            <c-a-i-data-extraction-detail-component
                parent-id={modifyObjectComponentDetails.detailId}
                detail-id={modifyObjectComponentDetails.detailId}
                parent-object={modifyObjectComponentDetails.objectName}
                object-name={modifyObjectComponentDetails.objectName}
                object-label={modifyObjectComponentDetails.objectLabel}
                relationship-field-options={modifyObjectComponentDetails.relationshipOptions}
                selected-relationship-field={modifyObjectComponentDetails.relationshipField}
                filter-field={modifyObjectComponentDetails.filterField}
                record-limit={modifyObjectComponentDetails.recordLimit}
                order-by={modifyObjectComponentDetails.orderBy}
                onclose={handleModifyObjectModalState}
                master-id={recordId}
                onrefresh={handleRefreshFromChild}
            ></c-a-i-data-extraction-detail-component>
        </template>
    </template>

</template>
