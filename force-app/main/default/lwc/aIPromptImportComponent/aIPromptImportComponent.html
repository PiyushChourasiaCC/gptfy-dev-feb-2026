<template>
    <div class="slds-page-header slds-page-header_record-home">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <span class="slds-icon_container slds-icon-standard-opportunity">
                            <lightning-icon icon-name="standard:data_mapping" alternative-text="Prompts" title="Prompts"></lightning-icon>
                        </span>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                                <h1>
                                    <span class="slds-page-header__title slds-truncate" title="Prompts">Prompts</span>
                                </h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls">
                    <div class="slds-page-header__control">
                        <button class="slds-button slds-button_destructive" onclick={handleNavigateToListView}>Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <template if:true={showSpinner}>
        <div style="height:19rem;position:relative">
            <div class="slds-spinner_container">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>
    </template>
    <template if:false={showSpinner}>
        <template if:false={mappings}>
            <div class="slds-p-around_small">
                <lightning-input 
                    type="file" 
                    accept=".json"
                    onchange={handleFileInputChange}
                ></lightning-input>
                {fileName}
            </div>
        </template>
        <template if:true={prompts}>
            <table class="slds-table_cell-buffer slds-table_bordered slds-table_striped">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th class="slds-p-around_x-small" scope="col">
                            <div title="Remove"></div>
                        </th>
                        <th class="slds-p-around_x-small" scope="col">
                            <div title="Name">Name</div>
                        </th>
                        <th class="slds-p-around_x-small" scope="col">
                            <div title="Object">Object</div>
                        </th>
                        <th class="slds-p-around_x-small" scope="col">
                            <div title="Description">Description</div>
                        </th>
                        <th class="slds-p-around_x-small" scope="col">
                            <div title="AI Model">AI Model</div>
                        </th>
                        <th class="slds-p-around_x-small" scope="col">
                            <div title="Data Context Mapping">Data Context Mapping</div>
                        </th>
                        <th class="slds-p-around_x-small" scope="col">
                            <div title="Type">Type</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={prompts} for:item="obj" for:index="mIndex">
                        <tr class="slds-hint-parent" key={obj.salesforceId}>
                            <td data-label="Remove" class="slds-p-around_x-small">
                                <div title="Remove">
                                    <lightning-button-icon data-mid={mIndex} icon-name="utility:close"  onclick={handlePromptRemove}></lightning-button-icon>
                                </div>
                            </td>
                            <td data-label="Name" class="slds-p-around_x-small">
                                <div title="Name">
                                    {obj.promptName}
                                </div>
                            </td>
                            <td data-label="Object" class="slds-p-around_x-small">
                                <div title="Object">
                                    {obj.objectName}
                                </div>
                            </td>
                            <td data-label="Description" class="slds-p-around_x-small">
                                <div title="Description">
                                    {obj.description}
                                </div>
                            </td>
                            <td data-label="AI Model" class="slds-p-around_x-small">
                                <div title="AI Model">
                                    {obj.connectionName}
                                </div>
                            </td>
                            <td data-label="Data Context Mapping" class="slds-p-around_x-small">
                                <div title="Data Context Mapping">
                                    {obj.extractionMappingName}
                                </div>
                            </td>
                            <td data-label="Type" class="slds-p-around_x-small">
                                <div title="Type">
                                    {obj.type}
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <div class="slds-align_absolute-center" style="height:3rem"></div>
        </template>
        <template if:false={prompts}>
            <div class="slds-align_absolute-center" style="height:5rem">
                No Prompts to show.
            </div>
        </template>
        <div class="slds-docked-form-footer">
            <button class="slds-button slds-button_neutral" onclick={handleReset}>Reset</button>
            <button class="slds-button slds-button_neutral" onclick={handleNavigateToListView}>Cancel</button>
            <button class="slds-button slds-button_brand" onclick={handleUpload}>Upload</button>
        </div>
    </template>
</template>
