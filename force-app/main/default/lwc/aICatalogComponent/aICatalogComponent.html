<template>
    <template if:true={showSpinner}>
        <div style="height:19rem;position:relative">
            <div class="slds-spinner_container">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>
    </template>
    <template if:false={showSpinner}>

        <div class="slds-page-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-opportunity" title="opportunity">
                                <lightning-icon icon-name="standard:proposition" style="--slds-c-icon-color-background:#43A6C6;" title="AI Models" size="large"></lightning-icon>
                                <span class="slds-assistive-text">AI Models</span>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="AI Models">AI Models</span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">
                                <lightning-formatted-rich-text value={label.Connections_header_label}></lightning-formatted-rich-text>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div style="height: 5px;"></div>

        <article class="slds-card">
            <div class="slds-card__body slds-card__body_inner">

        </article>

        <template if:true={showCCComponent}>
            <c-gptfy-add-card-component fields={fields} 
                                        object-api-name={objectApiName}
                                        header="AI Models" 
                                        card-type="AMODL" 
                                        oncancel={handleCancel} 
                                        onsuccess={handleSuccess}
