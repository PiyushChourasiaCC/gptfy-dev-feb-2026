<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading" aria-modal="true" aria-describedby="modal-content" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- Modal header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleFeedbackCancel}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>  
                <h2 id="modal-heading-02" class="slds-modal__title slds-hyphenate slds-truncate">
                    Provide Additional Feedback
                </h2> 
            </header>
            <!-- Modal body -->
            <div class="slds-modal__content slds-p-around_small" id="modal-content1">
                <div class="slds-grid slds-grid_vertical">
                    <div class="slds-col">
                        <span>
                            <lightning-textarea 
                                name="feedbackDetail" 
                                label="Feedback Detail" 
                                variant="label-hidden"
                                placeholder={feedbackDetailPlaceholder}
                                value={feedbackDetail}
                                onchange={handleFeedbackDetailChange}
                            ></lightning-textarea>
                        </span>
                    </div>
                    <template if:true={categoryOptions}>
                        <div class="slds-col slds-p-top_large">
                            <span>
                                <lightning-checkbox-group 
                                    name="feedbackCategory"
                                    label="Feedback Category"
                                    variant="label-hidden"
                                    options={categoryOptions}
                                    value={feedbackCategory}
                                    onchange={handleFeedbackCategoryChange}
                                ></lightning-checkbox-group>
                            </span>
                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Modal footer -->
            <footer class="slds-modal__footer">
                <lightning-button label="Submit feedback" title="Submit feedback" onclick={handleSubmitFeedback} variant="brand" class="slds-m-left_x-small"></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
