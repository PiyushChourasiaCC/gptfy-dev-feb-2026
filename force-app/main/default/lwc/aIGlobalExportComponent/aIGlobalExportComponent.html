<template>
    <template if:true={showSpinner}>
        <div style="height:5rem;position:relative">
            <div class="slds-spinner_container">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>
    </template>
    <template if:false={showSpinner}>
        <div class="slds-page-header slds-page-header_record-home">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-custom-custom67">
                                <lightning-icon icon-name="custom:custom67" alternative-text="custom67" title="custom67"></lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate">Global Export</span>
                                    </h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions slds-p-right_medium">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <button class="slds-button slds-button_neutral" type="button" onclick={handleReset}>Reset</button>
                            <button class="slds-button slds-button_brand" type="button" onclick={downloadExportFile} disabled={disableDownlaod}>Download</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__row slds-page-header__row_gutters">
                <div class="slds-page-header__col-details">
                    <ul class="slds-page-header__detail-row" style="width:100%;display:block;">
                        <lightning-tabset>
                            <lightning-tab label="Prompt" class="custom-prompt">
                                <c-a-i-global-prompt-export-component parentprompts={prompts} prompts-map={promptsMap} onselect={handleSelectPrompt}></c-a-i-global-prompt-export-component>
                            </lightning-tab>
                            <lightning-tab label="AI Models" title="AI Models">
                                <c-a-i-global-connection-export-component parentconnections={connections} selected-connections={selectedconnections} onselect={handleSelectConnections}></c-a-i-global-connection-export-component>
                            </lightning-tab>
                            <lightning-tab label="API Data Source" title="API Data Source">
                                <c-a-i-global-data-source-export-component parentdatasource={apiSources} selected-datasource={selectedapiSources} onselect={handleSelectApiSources}></c-a-i-global-data-source-export-component>
                            </lightning-tab>
                            <lightning-tab label="Security Layers" title="Security Layers">
                                <c-a-i-global-security-layer-export-component parentsecuritylayers={filters} selected-security-layers={selectedfilters} onselect={handleSelectFilters}></c-a-i-global-security-layer-export-component>
                            </lightning-tab>
                            <lightning-tab label="Catalog Card" title="Catalog Card">
                                <c-a-i-global-catalog-card-export-component parentcatalogcard={cardConfigs} selected-catalog-card={selectedcardConfigs} onselect={handleSelectCardConfigs}></c-a-i-global-catalog-card-export-component>
                            </lightning-tab>
                        </lightning-tabset>
                    </ul>
                </div>
            </div>
        </div>
    </template>
</template>
