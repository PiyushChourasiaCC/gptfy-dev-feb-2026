<template>
    <template if:true={showSpinner}>
        <div style="height:19rem;position:relative">
            <div class="slds-spinner_container">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>
    </template>

    <template if:false={showSpinner}>
        <div class="slds-page-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-opportunity" title="opportunity">
                                <lightning-icon icon-name="standard:record_delete" title="AI Settings" size="large" style="--slds-c-icon-color-background:#FFA500;"></lightning-icon>
                                <span class="slds-assistive-text">AI Settings</span>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="AI Settings">AI Settings</span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">
                                <lightning-formatted-rich-text value={label.AI_Settings_Header_Label}></lightning-formatted-rich-text>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div style="height: 5px;"></div>

        
            <!-- ... existing code ... -->
        
            <!-- Modal for scheduling -->
            <template if:true={isModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 id="modal-heading-01" class="slds-text-heading_medium">Schedule Daily Job</h2>
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close"
                                                alternative-text="Close"
                                                variant="inverse"
                                                size="small"
                                                aria-label="Close"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                        </header>
                        <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-1">
                            <lightning-input type="time" label="Time to run daily" value={scheduledTime} onchange={handleTimeChange}></lightning-input>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral"
                                              label="Cancel"
                                              onclick={closeModal}
                                              class="slds-var-p-around_x-small">
                            </lightning-button>
                            <lightning-button variant="brand"
                                              label="Schedule"
                                              onclick={scheduleJob}
                                              class="slds-var-p-around_x-small">
                            </lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
