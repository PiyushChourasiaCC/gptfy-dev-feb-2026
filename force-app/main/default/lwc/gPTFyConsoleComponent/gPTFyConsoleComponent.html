<template>
    
    <template if:true={showSpinner}>
        <template if:true={waitMsg}>
            <div class="slds-notify slds-notify_alert slds-theme_warning" role="alert">
                <h2 style="color:white;">
                    <strong>
                        {waitMsg}
                    </strong>   
                </h2>
            </div>
        </template>
        <template if:false={waitMsg}>
            <div style="height:5rem;position:relative">
                <div class="slds-spinner_container">
                    <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                        <span class="slds-assistive-text">Loading</span>
                        <div class="slds-spinner__dot-a"></div>
                        <div class="slds-spinner__dot-b"></div>
                    </div>
                </div>
            </div>
        </template>
    </template>

    <template if:false={showSpinner}>
        <template if:true={promptOptions}>

            <template if:true={mobileView}>
                <div style="text-align:left;justify-content:left;background-color:white;">
                    <template if:true={gptResponseSentiment}>
                        <div style={gptResponseSentiment}></div>
                    </template>

                    <div>
                        <div>
                            <h2 style="width:70%; display:inline-block;">
                                <lightning-combobox  title={selectedVisibilityExceptionMessage}
                                    label="Choose Prompt"
                                    variant="label-hidden"
                                    value={promptValue}
                                    placeholder="Select Prompt"
                                    options={promptOptions}
                                    onchange={handlePromptChange}
                                ></lightning-combobox>
                            </h2>

                            <h2 style="width:30%; display:inline-block; vertical-align: bottom; margin-bottom: 3px;">
                                <button  title={selectedVisibilityExceptionMessage} class="slds-button slds-button_brand slds-var-m-left_xxx-small"  disabled={gptfyBtnDisable} style="display:inline-block; padding-top: 4px; padding-bottom: 4px;" onclick={initiateGPT}>
                                    <img class="slds-button__icon slds-button__icon_left" src={gptfylogo} alt="gptfylogo" style="height: 21px; width: 21px; margin-left: auto; margin-right: auto;">
                                 </button>
                            </h2>
                        </div>

                        <template if:true={allowUserInput}>
                            <div class="slds-var-m-top_xxx-small">
                                <h2 style="width:100%; display:inline-block;">
                                    <lightning-input 
                                        variant="label-hidden" 
                                        type="text" 
                                        onchange={changePromptInput} 
                                        onkeypress={handleEnter} 
                                        name="input1" 
                                        value={userInput} 
                                        placeholder="Type your prompt and press Enter"
                                    ></lightning-input>
                                </h2>
                            </div>
                        </template>

                        <template if:true={selectedFiles}>
                            <div class="slds-var-m-top_xxx-small">
                                <template for:each={selectedFiles} for:item="file">
                                    <lightning-pill 
                                        label={file.title}
                                        key={file.docId}
                                        data-docid={file.docId}
                                        onremove={handleFileRemove}
                                    ></lightning-pill>
                                </template>
                            </div>
                        </template>

                        <div class="slds-var-m-top_xxx-small">
                            <h2 style="display:inline-block;">
                                
                                <template if:true={includeFiles}>
                                    <lightning-button-icon 
                                        icon-name="utility:attach"   
                                        variant="border-filled" 
                                        alternative-text="Files"
                                        title="Files"
                                        onclick={handleFilesModal}
                                        size="large"
                                        class="slds-var-m-right_xxx-small" 
                                    ></lightning-button-icon>
                                </template>

                                <template if:true={showExpanded}>
                                    <lightning-button-group>
                                        <lightning-button-icon 
                                            icon-name="utility:chevronleft"   
                                            variant="border-filled" 
                                            alternative-text="Previous"
                                            title="Previous"
                                            onclick={handleNext}
                                        ></lightning-button-icon>
                                        <lightning-button 
                                            label={currentResponseButtonLabel} 
                                            onclick={handleNothing}
                                        ></lightning-button>
                                        <lightning-button-icon 
                                            icon-name="utility:chevronright"   
                                            variant="border-filled" 
                                            alternative-text="Next"
                                            title="Next"
                                            onclick={handlePrevious}
                                        ></lightning-button-icon>
                                    </lightning-button-group>

                                    <template if:true={hasContentToDisplay}>
                                        <lightning-button-icon 
                                            icon-name="utility:copy_to_clipboard"   
                                            variant="border-filled" 
                                            alternative-text="Copy to clipboard"
                                            title="Copy to clipboard"
                                            class="slds-var-m-left_xxx-small" 
                                            onclick={handleCopy}
                                        ></lightning-button-icon>
                                    </template>
    
                                    <template if:true={hasContentToDisplay}>
                                        <lightning-button-icon 
                                            icon-name="utility:print" 
                                            variant="border-filled" 
                                            alternative-text="Print" 
                                            title="Print" 
                                            onclick={handlePreviewAndDownload} 
                                            class="slds-var-m-left_x-small">
                                        </lightning-button-icon>
                                        <lightning-button-icon 
                                            icon-name="utility:zoomin"   
                                            variant="border-filled" 
                                            alternative-text="Zoom"
                                            title="Zoom"
                                            class="slds-var-m-left_xxx-small" 
                                            onclick={handleZoom}
                                        ></lightning-button-icon>
                                    </template>

                                </template>
                            </h2>
                        </div>

                        <template if:true={hasContentToDisplay}>
                            <div class="slds-col">
                                <br>
                                <c-gpt-response 
                                    canvas-config={canvasConfig}
                                    gpt-ans-param={gptAns}
                                    onparentresponsecreated={handleParentResponseCreated}
                                    onbodychange={handleBodyChange}
                                    onhidefooter={handleHideFooter}
                                    onparentresponseupdated={handleParentResponseUpdated}>
                                </c-gpt-response>
                            </div>
                            <br>
                            <div class="slds-col">
                                <span>
                                    <div>
                                        <h2 style="display:inline-block; float:left;">
                                            <b>
                                                <template if:false={hasAdminUser}>
                                                    <div>
                                                        <lightning-formatted-text value={gptResponseName}></lightning-formatted-text>
                                                    </div>
                                                </template>
                                                <template if:true={hasAdminUser}>
                                                    <a href={gptResponseUrl} target="_blank">
                                                        <lightning-formatted-text value={gptResponseName}></lightning-formatted-text>
                                                    </a>
                                                </template>
                                            </b>
                                        </h2>
                                        <h2 style="display:inline-block; float:right; color:gray;">
                                            <lightning-formatted-date-time 
                                                value={gptResponseDate} 
                                                year="numeric"
                                                day="2-digit"
                                                month="short"
                                                hour="2-digit"
                                                minute="2-digit"
                                                time-zone={timeZone}
                                            ></lightning-formatted-date-time>
                                        </h2>
                                    </div>
                                </span>
                            </div>
                        </template>

                    </div>

                    <input disabled class="my-class" style="position:fixed;top:-5rem;height:1px;width:10px;"></input>

                </div>
            </template>

            <template if:false={mobileView}>

                <div style="text-align:left;justify-content:left;background-color:white; border-radius:0.3rem;">
                    <template if:true={gptResponseSentiment}>
                        <div style={gptResponseSentiment}></div>
                    </template>
                    
                    <div class="slds-grid slds-grid_vertical">
                        <div class="slds-p-top_x-small slds-p-left_x-small slds-p-right_x-small">
                            <h2 style="width:20%; display:inline-block;">
                                <lightning-combobox
                                    label="Choose Prompt"
                                    title={promptDescription}
                                    variant="label-hidden"
                                    value={promptValue}
                                    placeholder="Select Prompt"
                                    options={promptOptions}
                                    onchange={handlePromptChange}
                                ></lightning-combobox>
                            </h2>
                            <template if:true={allowUserInput}>
                                <h2 style="width:40%; display:inline-block;">
                                    <lightning-input 
                                        variant="label-hidden" 
                                        type="text" 
                                        onchange={changePromptInput} 
                                        onkeypress={handleEnter} 
                                        name="input1" 
                                        value={userInput} 
                                        placeholder="Type your prompt and press Enter"
                                        class="slds-var-m-left_x-small" 
                                    ></lightning-input>
                                </h2>
                            </template>

                            <template if:true={includeFiles}>
                                <h2 style="display:inline-block;">
                                    <lightning-button-icon 
                                        icon-name="utility:attach"   
                                        variant="border-filled" 
                                        alternative-text="Files"
                                        title="Files"
                                        onclick={handleFilesModal}
                                        size="large"
                                        class="slds-var-m-left_x-small" 
                                    ></lightning-button-icon>
                                </h2>
                            </template>

                            <button title={selectedVisibilityExceptionMessage} class="slds-button slds-button_brand slds-var-m-left_x-small" disabled={gptfyBtnDisable} style="display:inline-block;" onclick={initiateGPT}>
                                <img class="slds-button__icon slds-button__icon_left" src={gptfylogo} alt="gptfylogo" style="width: 20px; height: 20px; margin-bottom: 4px;">
                                Run GPTfy
                            </button>

                            <h2 style="display:inline-block; float:right;">

                                <template if:true={showExpanded}>
                                    <lightning-button-group class="slds-var-m-left_x-small">
                                        <lightning-button-icon 
                                            icon-name="utility:chevronleft"   
                                            variant="border-filled" 
                                            alternative-text="Previous"
                                            title="Previous"
                                            onclick={handleNext}
                                        ></lightning-button-icon>
                                        <lightning-button 
                                            label={currentResponseButtonLabel} 
                                            onclick={handleNothing}
                                        ></lightning-button>
                                        <lightning-button-icon 
                                            icon-name="utility:chevronright"   
                                            variant="border-filled" 
                                            alternative-text="Next"
                                            title="Next"
                                            onclick={handlePrevious}
                                        ></lightning-button-icon>
                                    </lightning-button-group>

                                    <template if:true={hasContentToDisplay}>
                                        <template if:false={hasPortalUser}>
                                            <template if:true={emailActionName}>
                                                <lightning-button-icon 
                                                    icon-name="utility:email"   
                                                    variant="border-filled" 
                                                    alternative-text="Send Email"
                                                    title="Send Email"
                                                    class="slds-var-m-left_x-small" 
                                                    onclick={handleSendEmail}
                                                ></lightning-button-icon>
                                            </template>
                                            <template if:true={openFormActions}>
                                                <template if:true={openFormActions.length}>
                                                    <lightning-button-icon 
                                                        icon-name="utility:form"   
                                                        variant="border-filled" 
                                                        alternative-text="Open Form"
                                                        title="Open Form"
                                                        class="slds-var-m-left_x-small" 
                                                        onclick={handleOpenFormClick}
                                                    ></lightning-button-icon>
                                                </template>
                                            </template>
                                            
                                            <!--lightning-button-icon 
                                                icon-name="utility:task"   
                                                variant="border-filled" 
                                                alternative-text="New Task"
                                                title="New Task"
                                                class="slds-var-m-left_x-small" 
                                                onclick={handleNewTask}
                                            ></lightning-button-icon-->
                                        </template>
                                        <lightning-button-icon 
                                            icon-name="utility:copy_to_clipboard"   
                                            variant="border-filled" 
                                            alternative-text="Copy to clipboard"
                                            title="Copy to clipboard"
                                            class="slds-var-m-left_x-small" 
                                            onclick={handleCopy}
                                        ></lightning-button-icon>
                                        <lightning-button-icon 
                                            icon-name="utility:print" 
                                            variant="border-filled" 
                                            alternative-text="Print" 
                                            title="Print" 
                                            onclick={handlePreviewAndDownload} 
                                            class="slds-var-m-left_x-small">
                                        </lightning-button-icon>
                                        <lightning-button-icon 
                                            icon-name="utility:zoomin"   
                                            variant="border-filled" 
                                            alternative-text="Zoom"
                                            title="Zoom"
                                            class="slds-var-m-left_x-small" 
                                            onclick={handlePopOutContent}
                                        ></lightning-button-icon>
                                        <template if:true={showChatButton}>
                                            <lightning-button-icon 
                                                size="large"
                                                icon-name="utility:chat"  
                                                variant="border-filled" 
                                                alternative-text="Chat" 
                                                class="slds-var-m-left_x-small"
                                                title="Chat"
                                                onclick={openChatWindow}>
                                            </lightning-button-icon>
                                        </template>
                                    </template>

                                </template>
                                <template if:true={showExpanded}>
                                    <lightning-button-icon 
                                        icon-name="utility:contract_alt"   
                                        variant="border-filled" 
                                        size="large"
                                        alternative-text="Collapse"
                                        title="Collapse"
                                        class="slds-var-m-left_x-small" 
                                        onclick={handleExpand}
                                    ></lightning-button-icon>
                                </template>

                                <template if:false={showExpanded}>
                                    <template if:true={noOfResponses}>
                                        <lightning-button-icon 
                                            icon-name="utility:expand_alt"   
                                            variant="border-filled" 
                                            size="large"
                                            alternative-text="Expand"
                                            title="Expand"
                                            class="slds-var-m-left_x-small" 
                                            onclick={handleExpand}
                                        ></lightning-button-icon>
                                    </template>
                                </template>

                            </h2>

                        </div>

                        <template if:true={selectedFiles}>
                            <div class="slds-var-m-top_xx-small slds-p-left_x-small slds-p-right_x-small">
                                <template for:each={selectedFiles} for:item="file">
                                    <lightning-pill 
                                        label={file.title}
                                        key={file.docId}
                                        data-docid={file.docId}
                                        onremove={handleFileRemove}
                                        class="slds-var-m-left_xxx-small"
                                    ></lightning-pill>
                                </template>
                            </div>
                        </template>

                        <template if:false={showExpanded}>
                            <div class="slds-p-bottom_x-small"></div>
                        </template>

                        <template if:true={hasContentToDisplay}>
                            <template if:true={showExpanded}>
                                <div class="slds-col">
                                    <br>
                                    <div class="slds-grid">
                                        <div class="slds-col slds-p-left_x-small slds-p-right_x-small slds-p-bottom_x-small" style="max-height: 400px; overflow-y:auto;">
                                            <span lwc:if={responseLoaded}>
                                                <c-gpt-response 
                                                    data-id="response"
                                                    canvas-config={canvasConfig}
                                                    gpt-ans-param={gptAns}
                                                    onparentresponsecreated={handleParentResponseCreated}
                                                    onbodychange={handleBodyChange}
                                                    onhidefooter={handleHideFooter}
                                                    onparentresponseupdated={handleParentResponseUpdated}>
                                                </c-gpt-response>
                                            </span>
                                        </div>
                                        <template if:true={showHowItWorks}>
                                            <div class="slds-col">
                                                <span>
                                                    <div class="slds-panel slds-size_large slds-panel_docked slds-panel_docked-right slds-is-open">
                                                        <div class="slds-panel__header">
                                                            <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate" title="How it is Generated?">How it is Generated?</h2>
                                                            <div class="slds-panel__header-actions">
                                                                <button class="slds-button slds-button_icon slds-button_icon-small slds-panel__close" title="Collapse" onclick={handleHowItWorks}>
                                                                    <lightning-icon icon-name="utility:close" alternative-text="Collapse" title="Collapse" size="x-small"></lightning-icon>
                                                                    <span class="slds-assistive-text">Collapse</span>
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <div class="slds-panel__body" style="max-height: 350px; overflow-y:auto;">
                                                            <lightning-formatted-rich-text
                                                                value={howItWorks}
                                                            ></lightning-formatted-rich-text>
                                                        </div>
                                                    </div>
                                                </span>
                                            </div>
                                        </template>
                                        <!-- <template if:true={showChatWindow}> -->
                                            <!-- <div class="slds-col chat-panel-container">
                                                <div class="slds-panel slds-size_large slds-panel_docked slds-panel_docked-right slds-is-open chat-panel-wrapper">
                                                    <div class="slds-panel__header chat-header">
                                                        <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate" title="Chat">
                                                            <img src={gptfylogo} alt="gptfylogo" style="height: 20px; width: 22px; margin-left: auto; margin-right: auto; margin-top: -4px;"> &nbsp;GPTfy
                                                        </h2>
                                                        <div class="slds-panel__header-actions">
                                                            <button class="slds-button slds-button_icon slds-button_icon-small slds-panel__close" 
                                                                    title="Close Chat" onclick={closeChat}>
                                                                <lightning-icon icon-name="utility:close" alternative-text="Close" variant="bare" 
                                                                              title="Close" size="x-small"></lightning-icon>
                                                                <span class="slds-assistive-text">Close Chat</span>
                                                            </button>
                                                        </div>
                                                    </div>
                                                    
                                                    <div class="slds-panel__body chat-body-container" lwc:ref="panelBody">
                                                        <c-a-i-chat 
                                                            response={aiResponse}
                                                            container-height={availableHeight}>
                                                        </c-a-i-chat>
                                                    </div>
                                                </div>
                                            </div> -->
                                            <!-- <c-a-i-agnetic-chat-container 
                                                ai-response-name={aiResponse.Name}>
                                            </c-a-i-agnetic-chat-container>
                                        </template> -->
                                    </div>
                                </div>
                                <div class="slds-col slds-p-left_x-small slds-p-right_x-small" style="background-color: rgb(250,250,250); border-radius:0.3rem;">
                                    <span>
                                        <div>
                                            <h2 style="display:inline-block; float:left; padding-top: 5px;">
                                                <b>
                                                    <template if:false={hasAdminUser}>
                                                        <div>
                                                            <lightning-formatted-text value={gptResponseName}></lightning-formatted-text>
                                                        </div>
                                                    </template>
                                                    <template if:true={hasAdminUser}>
                                                        <a href={gptResponseUrl} target="_blank">
                                                            <lightning-formatted-text value={gptResponseName}></lightning-formatted-text>
                                                        </a>
                                                    </template>
                                                </b>
                                            </h2>
                                            <h2 style="display:inline-block; float:right; color:gray;">
                                                <template if:true={timeSaved}>
                                                    <span class="slds-m-right_xx-small">
                                                        {timeSaved} seconds Saved&nbsp;|&nbsp; 
                                                    </span>
                                                </template>    
                                                <lightning-formatted-date-time 
                                                    value={gptResponseDate} 
                                                    year="numeric"
                                                    day="2-digit"
                                                    month="short"
                                                    hour="2-digit"
                                                    minute="2-digit"
                                                    time-zone={timeZone}
                                                ></lightning-formatted-date-time>
                                                <template if:true={howItWorks}>
                                                    <span class="slds-m-right_xx-small" onclick={handleHowItWorks}>
                                                        &nbsp;|&nbsp;<a href="#" style="color:gray;">How it Works?</a>
                                                    </span>
                                                </template>
                                                <template if:false={hasPortalUser}>
                                                    <template if:false={likeState}>
                                                        &nbsp;|&nbsp;
                                                        <lightning-button-stateful
                                                            label-when-off=""
                                                            label-when-on=""
                                                            icon-name-when-off="utility:dislike"
                                                            icon-name-when-on="utility:dislike"
                                                            variant="text"
                                                            selected={dislikeState}
                                                            disabled={dislikeState}
                                                            onclick={handleDislikeButtonClick}>
                                                        </lightning-button-stateful>
                                                    </template>
                                                </template>
                                            </h2>
                                        </div>
                                    </span>
                                </div>
                            </template>
                        </template>
                    </div>
                    
                </div>
            </template>

        </template>
    </template>
    <template if:true={showChatWindow}>
        <!-- <div class="slds-col chat-panel-container">
            <div class="slds-panel slds-size_large slds-panel_docked slds-panel_docked-right slds-is-open chat-panel-wrapper">
                <div class="slds-panel__header chat-header">
                    <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate" title="Chat">
                        <img src={gptfylogo} alt="gptfylogo" style="height: 20px; width: 22px; margin-left: auto; margin-right: auto; margin-top: -4px;"> &nbsp;GPTfy
                    </h2>
                    <div class="slds-panel__header-actions">
                        <button class="slds-button slds-button_icon slds-button_icon-small slds-panel__close" 
                                title="Close Chat" onclick={closeChat}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" variant="bare" 
                                          title="Close" size="x-small"></lightning-icon>
                            <span class="slds-assistive-text">Close Chat</span>
                        </button>
                    </div>
                </div>
                
                <div class="slds-panel__body chat-body-container" lwc:ref="panelBody">
                    <c-a-i-chat 
                        response={aiResponse}
                        container-height={availableHeight}>
                    </c-a-i-chat>
                </div>
            </div>
        </div> -->
        <div>
            <c-a-i-agentic-chat-container 
                ai-response-name={aiResponse.Name}
                onclosechat={closeChat}>
            </c-a-i-agentic-chat-container>
        </div>
    </template>
    <template if:true={showAttachModal}>

        <template if:true={mobileView}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class={modalClass}>
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleAttachCancel}></lightning-button-icon>
                        <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Attach Files</h1>
                    </div>
                    <div class="slds-modal__content" id="modal-content-id-1">
                        <template if:true={showSpinner}>
                            <div style="height:19rem;position:relative">
                                <div class="slds-spinner_container">
                                    <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                        <span class="slds-assistive-text">Loading</span>
                                        <div class="slds-spinner__dot-a"></div>
                                        <div class="slds-spinner__dot-b"></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:false={showSpinner}>
                            <template if:true={attachmentData}>
                                <lightning-accordion 
                                    allow-multiple-sections-open
                                    active-section-name={attachActiveSessions}>
                                    <template for:each={attachmentData} for:item="rec">
                                        <lightning-accordion-section name={rec.recId} label={rec.name} key={rec.recId}>
                                            <lightning-datatable
                                                key-field="docId"
                                                data={rec.files}
                                                data-recid={rec.recId}
                                                columns={attachColumns}
                                                max-row-selection={maxFileCount}>
                                            </lightning-datatable>
                                        </lightning-accordion-section>
                                    </template>
                                </lightning-accordion>
                            </template>
                        </template>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Cancel" title="Cancel" onclick={handleAttachCancel}></lightning-button>
                        <lightning-button label="Attach" title="Attach" onclick={handleAttach} variant="brand" class="slds-m-left_x-small"></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template if:false={mobileView}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true" class={modalClass}>
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleAttachCancel}></lightning-button-icon>
                        <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate">Attach Files</h1>
                    </div>
                    <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-2" style="min-height:500px;">
                        <template if:true={showSpinner}>
                            <div style="height:19rem;position:relative">
                                <div class="slds-spinner_container">
                                    <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                        <span class="slds-assistive-text">Loading</span>
                                        <div class="slds-spinner__dot-a"></div>
                                        <div class="slds-spinner__dot-b"></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:false={showSpinner}>
                            <template if:true={attachmentData}>
                                <lightning-accordion 
                                    allow-multiple-sections-open
                                    active-section-name={attachActiveSessions}>
                                    <template for:each={attachmentData} for:item="rec">
                                        <lightning-accordion-section name={rec.recId} label={rec.name} key={rec.recId}>
                                            <lightning-datatable
                                                key-field="docId"
                                                data={rec.files}
                                                data-recid={rec.recId}
                                                columns={attachColumns}
                                                max-row-selection={maxFileCount}>
                                            </lightning-datatable>
                                        </lightning-accordion-section>
                                    </template>
                                </lightning-accordion>
                            </template>
                        </template>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Cancel" title="Cancel" onclick={handleAttachCancel}></lightning-button>
                        <lightning-button label="Attach" title="Attach" onclick={handleAttach} variant="brand" class="slds-m-left_x-small"></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
        
    </template>

    <template if:true={showFeedbackModal}>
        <template if:false={mobileView}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true" class={modalClass}>
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleFeedbackCancel}></lightning-button-icon>
                        <h1 id="modal-heading-04" class="slds-modal__title slds-hyphenate">Provide Additional Feedback</h1>
                    </div>
                    <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-4">
                        <div class="slds-grid slds-grid_vertical">
                            <div class="slds-col">
                                <span>
                                    <lightning-textarea 
                                        name="feedbackDetail" 
                                        label="Feedback Detail" 
                                        variant="label-hidden"
                                        placeholder={feedbackDetailPlaceholder}
                                        value={feedbackDetail}
                                        onchange={handleFeedbackDetailChange}
                                    ></lightning-textarea>
                                </span>
                            </div>
                            <template if:true={dislikeState}>
                                <template if:true={feedbackCategoryOptions}>
                                    <div class="slds-col slds-p-top_large">
                                        <span>
                                            <lightning-checkbox-group 
                                                name="feedbackCategory"
                                                label="Feedback Category"
                                                variant="label-hidden"
                                                options={feedbackCategoryOptions}
                                                value={feedbackCategory}
                                                onchange={handleFeedbackCategoryChange}
                                            ></lightning-checkbox-group>
                                        </span>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Submit feedback" title="Submit feedback" onclick={handleSubmitFeedback} variant="brand" class="slds-m-left_x-small"></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </template>

    <template if:true={showFileAlertModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true" class={modalClass}>
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleFileAlertCancel}></lightning-button-icon>
                    <h1 id="modal-heading-05" class="slds-modal__title slds-hyphenate">Alert</h1>
                </div>
                <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-5">
                    <div class="slds-grid slds-grid_vertical slds-align_absolute-center" style="height:5rem">
                        Oops! Looks like you missed attaching a file. Are you sure you want to continue?
                    </div>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="No" title="No" onclick={handleFileAlertCancel} variant="brand" class="slds-m-left_x-small"></lightning-button>
                    <lightning-button label="Yes" title="Yes" onclick={handleFileAlertConfirm} variant="brand" class="slds-m-left_x-small"></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template if:true={showOpenFormModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true" class={modalClass}>
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleOpenFormClick}></lightning-button-icon>
                    <h1 id="modal-heading-06" class="slds-modal__title slds-hyphenate">Create Record</h1>
                </div>
                <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-6">
                    <!--template if:true={selectedFormAction}>
                        {selectedFormAction.objectLabel}
                    </template>
                    <template if:false={selectedFormAction}-->
                        <template if:true={openFormActions}>
                            <fieldset class="slds-form-element" role="radiogroup">
                                <div class="slds-form-element__control">
                                    <template for:each={openFormActions} for:item="ofa" for:index="ofaIndex">
                                        <div class="slds-visual-picker slds-visual-picker_vertical" key={ofa.actionId} style="width: 100%;" data-id={ofa.actionId} data-index={ofaIndex} onclick={handleOpenFormOptionSelect}>
                                            <input type="radio" value="visual-picker-94" name="example-unique-name-36" data-id={ofa.actionId} data-index={ofaIndex}/>
                                            <label for="visual-picker-94" style="width: 100%;" data-id={ofa.actionId} data-index={ofaIndex}>
                                                <span class="slds-visual-picker__figure slds-visual-picker__text" style="width: 100%;" data-id={ofa.actionId} data-index={ofaIndex}>
                                                    <span data-id={ofa.actionId} data-index={ofaIndex}>
                                                        <span class="slds-text-heading_medium slds-m-bottom_x-small" data-id={ofa.actionId} data-index={ofaIndex}>{ofa.objectLabel}</span>
                                                        <span class="slds-text-title" data-id={ofa.actionId} data-index={ofaIndex}>{ofa.description}</span>
                                                    </span>
                                                </span>
                                            </label>
                                          </div>
                                    </template>
                                </div>
                            </fieldset>
                        </template>
                    <!--/template-->
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" title="Cancel" onclick={handleOpenFormClick} variant="brand" class="slds-m-left_x-small"></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template if:true={showPopOutContent}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <div class="slds-modal__container">
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-8">
                    <c-gpt-response 
                        canvas-config={popoutCanvasConfig}
                        gpt-ans-param={gptAns}
                        onparentresponsecreated={handleParentResponseCreated}
                        onbodychange={handleBodyChange}
                        onhidefooter={handleHideFooter}
                        onparentresponseupdated={handleParentResponseUpdated}>
                    </c-gpt-response>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Close" title="Close" onclick={handlePopOutContent}></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
