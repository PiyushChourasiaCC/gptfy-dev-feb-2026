<template>

    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <lightning-button-icon class="slds-modal__close slds-button_icon-inverse" size="large" icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleCancel}></lightning-button-icon>
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Data Context Mapping</h1>
            </div>
            <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-1" style="min-height:550px;">
                <template if:true={showSpinner}>
                    <div style="height:19rem;position:relative">
                        <div class="slds-spinner_container">
                            <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                    </div>
                </template>
                <template if:false={showSpinner}>
                    <template if:true={objects}>

                        <lightning-input 
                            type="text" 
                            name="mappingName" 
                            label="Mapping Name" 
                            value={mappingName} 
                            required 
                            class="mappingName"
                            field-level-help={helpText_MapName}
                        ></lightning-input>

                        <template if:true={recordId}>
                            <lightning-combobox
                                name="targetObject"
                                label="Target Object"
                                value={targetObject}
                                placeholder="Select Target Object"
                                options={objects}
                                required
                                disabled
                                class="targetObject"
                                field-level-help={helpText_TargetObject}
                            ></lightning-combobox>
                        </template>
                        <template if:false={recordId}>
                            <lightning-combobox
                                name="targetObject"
                                label="Target Object"
                                value={targetObject}
                                placeholder="Select Target Object"
                                options={objects}
                                onchange={handleObjectChange}
                                required
                                class="targetObject"
                                field-level-help={helpText_TargetObject}
                            ></lightning-combobox>
                        </template>
                        <lightning-input 
                            type="text" 
                            label="Target Object Label"
                            name="targetObjectLabel"
                            value={selectedObjectLabel}
                            placeholder="Enter Object Label"
                            required
                            onchange={handleLabelChange}
                            field-level-help={helpText_TargetObject}
                        ></lightning-input>

                        <lightning-textarea 
                            name="description" 
                            label="Description" 
                            value={description} 
                            class="description" 
                            field-level-help={helpText_description}
                        ></lightning-textarea>

                        <lightning-accordion allow-multiple-sections-open>
                            <lightning-accordion-section name="A" label="Advanced Settings">
                                <template if:true={dataSourceOptions}>
                                    <lightning-combobox
                                        name="aiDataSource"
                                        label="Select API Data Connection"
                                        value={aiDataSource}
                                        placeholder="Select API Data Connection"
                                        options={dataSourceOptions}
                                        onchange={handleDataSourceChange}
                                        field-level-help={helpText_DataSource}
                                    ></lightning-combobox>
                                </template>
                                <template if:true={apexSecurityLayerOptions}>
                                    <lightning-combobox
                                        name="aiApexSecurityLayer"
                                        label="Select Apex Security Layer"
                                        value={apexSecurityLayer}
                                        placeholder="Select Apex Security Layer"
                                        options={apexSecurityLayerOptions}
                                        onchange={handleApexSecurityLayerChange}
                                    ></lightning-combobox>
                                </template>
                            </lightning-accordion-section>
                        </lightning-accordion>

                    </template>
                </template>
            </div>
            <div class="slds-modal__footer">
                <lightning-button label="Cancel" title="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button label="Save" title="Save" onclick={handleSave} variant="brand" class="slds-m-left_x-small"></lightning-button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

</template>
